name: badge
on:
  workflow_run:
    workflows: [quality]
    types: [completed]
    branches: [main]
permissions: {}
jobs:
  coverage:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository_owner == 'jeancarlos'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-percent
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: write coverage badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERCENT=$(head -n 1 percent.txt | tr -d '[:space:]')
          if ! [[ "$PERCENT" =~ ^[0-9]{1,3}$ ]] || [ "$PERCENT" -gt 100 ]; then echo "bad percent"; exit 1; fi
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q badge
          cd badge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 "$url" badges; then git checkout -q -B badges FETCH_HEAD; else git checkout -q --orphan badges; fi
          if [ "$PERCENT" -ge 90 ]; then color=brightgreen; elif [ "$PERCENT" -ge 80 ]; then color=green; elif [ "$PERCENT" -ge 70 ]; then color=yellowgreen; elif [ "$PERCENT" -ge 60 ]; then color=yellow; else color=orange; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PERCENT" "$color" > coverage.json
          git add coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "coverage ${PERCENT}%"
          git push -q "$url" HEAD:badges
