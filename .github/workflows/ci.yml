name: ci
on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: shellcheck .githooks/pre-commit .githooks/commit-msg scripts/install-hooks.sh install.sh bin/contas-bot test/smoke-install.sh
      - run: sh test/smoke-install.sh

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::PRs must come from this repository (got: $HEAD_REPO)"
            exit 1
          }
          [ "$HEAD" = develop ] || echo "$HEAD" | grep -Eq '^((feature|fix|chore)/[a-z0-9._-]+|dependabot/[A-Za-z0-9._/-]+)$' || {
            echo "::error::PRs into develop must come from feature/*, fix/*, chore/* or dependabot/* (got: $HEAD)"
            exit 1
          }

  source-is-develop:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::PRs must come from this repository (got: $HEAD_REPO)"
            exit 1
          }
          [ "$HEAD" = develop ] || {
            echo "::error::Only develop merges into main (got: $HEAD)"
            exit 1
          }
