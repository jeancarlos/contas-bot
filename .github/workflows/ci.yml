name: ci
on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: shellcheck .githooks/pre-commit .githooks/commit-msg scripts/install-hooks.sh install.sh bin/contas-bot test/smoke-install.sh
      - run: sh test/smoke-install.sh

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::PRs must come from this repository (got: $HEAD_REPO)"
            exit 1
          }
          [ "$HEAD" = develop ] || echo "$HEAD" | grep -Eq '^((feature|fix|chore)/[a-z0-9._-]+|dependabot/[A-Za-z0-9._/-]+)$' || {
            echo "::error::PRs into develop must come from feature/*, fix/*, chore/* or dependabot/* (got: $HEAD)"
            exit 1
          }

  fixes-have-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/test-policy.ts "$BASE..$HEAD"

  source-is-develop:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || {
            echo "::error::PRs must come from this repository (got: $HEAD_REPO)"
            exit 1
          }
          [ "$HEAD" = develop ] || {
            echo "::error::Only develop merges into main (got: $HEAD)"
            exit 1
          }
