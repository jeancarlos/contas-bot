name: dynamic
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test --test-reporter=spec test/core/fuzz.test.ts test/core/props.test.ts test/core/roundtrip.test.ts
