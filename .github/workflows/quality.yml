name: quality
on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage
      # Codecov may not be set up yet: never let it block CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  observability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Boot the bot and check /metrics and /summary.json
        env:
          ALLOW_EMPTY_STATE: '1'
          HTTP_PORT: '18080'
          DB_FILE: ${{ runner.temp }}/c.db
          STATE_FILE: ${{ runner.temp }}/s.json
          AUTH_DIR: ${{ runner.temp }}/auth
        run: |
          node src/shell/index.ts > "$RUNNER_TEMP/bot.log" 2>&1 &
          bot=$!
          trap 'kill "$bot" 2>/dev/null; echo "--- bot log"; cat "$RUNNER_TEMP/bot.log"' EXIT
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused -o metrics.txt "http://127.0.0.1:$HTTP_PORT/metrics"
          cat metrics.txt
          rc=0
          docker run --rm -i --entrypoint promtool prom/prometheus:v3.5.0 check metrics < metrics.txt > promtool.txt 2>&1 || rc=$?
          cat promtool.txt
          # promtool exits 3 on lint-only problems; missing HELP text is tolerated until /metrics emits # HELP lines.
          case "$rc" in
            0) ;;
            3) if grep -v ' no help text$' promtool.txt; then exit 1; fi ;;
            *) exit 1 ;;
          esac
          grep -Eq '^contas_whatsapp_connected [01]$' metrics.txt
          curl -fsS "http://127.0.0.1:$HTTP_PORT/summary.json" \
            | node -e 'const s = JSON.parse(require("fs").readFileSync(0, "utf8")); if (!Array.isArray(s.groups)) process.exit(1)'
