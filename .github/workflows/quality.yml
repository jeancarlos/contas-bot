name: quality
on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run coverage
      - name: Coverage percent for the badge
        run: |
          awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{printf "%d\n", h*100/f}' lcov.info > percent.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-percent
          path: percent.txt
      # Codecov may not be set up yet: never let it block CI.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  observability:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Boot the bot and check /metrics and /summary.json
        env:
          ALLOW_EMPTY_STATE: '1'
          HTTP_PORT: '18080'
          DB_FILE: ${{ runner.temp }}/c.db
          STATE_FILE: ${{ runner.temp }}/s.json
          AUTH_DIR: ${{ runner.temp }}/auth
        run: |
          node src/shell/index.ts > "$RUNNER_TEMP/bot.log" 2>&1 &
          bot=$!
          trap 'kill "$bot" 2>/dev/null; echo "--- bot log"; cat "$RUNNER_TEMP/bot.log"' EXIT
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused -o metrics.txt "http://127.0.0.1:$HTTP_PORT/metrics"
          cat metrics.txt
          docker run --rm -i --entrypoint promtool prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check metrics < metrics.txt
          grep -Eq '^contas_whatsapp_connected [01]$' metrics.txt
          curl -fsS -o summary.json "http://127.0.0.1:$HTTP_PORT/summary.json"
          node -e 'const s = JSON.parse(require("fs").readFileSync("summary.json", "utf8")); if (!Array.isArray(s.groups)) process.exit(1)'
