name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Fetch changelog notes
        run: git fetch origin 'refs/notes/changelog:refs/notes/changelog' || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: sh test/smoke-install.sh
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the changelog
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/changelog.ts CHANGELOG.json dist/notes.md "$VERSION"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jeancarlos/contas-bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/jeancarlos/contas-bot
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch changelog notes
        run: git fetch origin 'refs/notes/changelog:refs/notes/changelog' || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the changelog
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: node scripts/changelog.ts CHANGELOG.json dist/notes.md "$VERSION"
      - name: Stamp the installer
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: mkdir -p dist && sed "s|__VERSION__|$VERSION|" install.sh > dist/install.sh
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/install.sh
      - name: Name the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/install.sh.intoto.jsonl
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- --notes-file dist/notes.md
          case "$GITHUB_REF_NAME" in *-*) set -- --prerelease --generate-notes ;; esac
          gh release create "$GITHUB_REF_NAME" dist/install.sh dist/install.sh.intoto.jsonl "$@" --verify-tag \
            || { gh release upload "$GITHUB_REF_NAME" dist/install.sh dist/install.sh.intoto.jsonl --clobber \
              && case "$GITHUB_REF_NAME" in *-*) ;; *) gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md ;; esac; }
