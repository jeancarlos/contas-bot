name: release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Fetch changelog notes
        run: git fetch origin 'refs/notes/changelog:refs/notes/changelog' || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: sh test/smoke-install.sh
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the changelog
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: node scripts/changelog.ts CHANGELOG.json dist/notes.md "$VERSION"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/jeancarlos/contas-bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/jeancarlos/contas-bot
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch changelog notes
        run: git fetch origin 'refs/notes/changelog:refs/notes/changelog' || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the changelog
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: node scripts/changelog.ts CHANGELOG.json dist/notes.md "$VERSION"
      - name: Stamp the installer
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: mkdir -p dist && sed "s|__VERSION__|$VERSION|" install.sh > dist/install.sh
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/install.sh
      - name: Name the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/install.sh.intoto.jsonl
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- --notes-file dist/notes.md
          case "$GITHUB_REF_NAME" in *-*) set -- --prerelease --generate-notes ;; esac
          gh release create "$GITHUB_REF_NAME" dist/install.sh dist/install.sh.intoto.jsonl "$@" --verify-tag \
            || { gh release upload "$GITHUB_REF_NAME" dist/install.sh dist/install.sh.intoto.jsonl --clobber \
              && case "$GITHUB_REF_NAME" in *-*) ;; *) gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md ;; esac; }
