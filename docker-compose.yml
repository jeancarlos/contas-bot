services:
  contas-bot:
    build: .
    container_name: contas-bot
    restart: unless-stopped
    user: "1000:1000"
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file: .env
    environment:
      - AUTH_DIR=/app/auth
      - STATE_FILE=/app/data/state.json
    volumes:
      - ./auth:/app/auth
      - ./data:/app/data
    labels:
      - wud.watch=false
